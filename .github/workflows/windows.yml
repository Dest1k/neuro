name: Windows proof and worker checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      # Pinned Pearl recursively includes deeply named CUTLASS examples. Keep
      # Cargo's Git checkout below the Windows path limit without registry edits.
      CARGO_HOME: C:\nc
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source and lockfile bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned native Windows Rust toolchain
        id: toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            C:\nc\registry
            C:\nc\git
            build/proof-target
          key: ${{ runner.os }}-pearl-proof-msvc-rust-1.99.1-${{ hashFiles('configs/proof-build.json', 'rust/pearl-proof-check/Cargo.lock', 'upstream/cppminer/rust/cp-proof-ffi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pearl-proof-msvc-rust-1.99.1-
      - name: Verify Windows process bounds and child cleanup
        run: ./windows/test_worker.ps1
      - name: Verify fixed remote worker reports and identity checks
        run: ./windows/test_remote_worker.ps1
      - name: Build real Rust and native Windows proof targets
        id: build
        # Keep independent compiler evidence when a worker fixture fails.
        # Such a failed fixture still makes the whole job fail.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: ./windows/ci.ps1 -Action build-cpu
      - name: Run Windows CPU correctness, proofs and actual TCP replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./windows/ci.ps1 -Action run-cpu
      - name: Retain Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-proof-worker-evidence
          path: |
            artifacts/windows/
            artifacts/proof-build.json
            artifacts/proof-build/**/*.log
            artifacts/pool-replay/
            build/windows/Testing/Temporary/LastTest.log
