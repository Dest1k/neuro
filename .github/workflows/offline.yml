name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned upstream
        run: python tools/neuroctl.py source-check
      - name: Preserve the owner's empty README
        run: python -c "from pathlib import Path; assert Path('README.md').read_bytes() == b''"
      - name: Test cost and experiment controls
        run: python -m unittest discover -s tests -v
      - name: Verify independent arithmetic fixtures
        run: python tools/generate_fullk_fixtures.py --check
      - name: Verify pinned BLAKE3 expected vectors
        run: python tools/generate_blake3_vectors.py --check
      - name: Install pinned independent fixture binding
        run: python -m pip install --require-hashes -r requirements-fixtures.txt
      - name: Verify independent Pearl input fixtures
        run: python tools/generate_pearl_fixtures.py --check
      - name: Compile and run CPU component checks
        run: python tools/neuroctl.py cpu-check --output artifacts/cpu-check.json
      - name: Exercise CMake build definition
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake -j 2
          ctest --test-dir build/cmake --output-on-failure
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/proof-target
          key: ${{ runner.os }}-pearl-proof-rust-1.99.1-${{ hashFiles('configs/proof-build.json', 'rust/pearl-proof-check/Cargo.lock', 'upstream/cppminer/rust/cp-proof-ffi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pearl-proof-rust-1.99.1-
      - name: Check independent jackpot and target vectors
        run: |
          python -m pip install --require-hashes -r requirements-fixtures.txt
          python tools/generate_proof_fixtures.py --check
      - name: Build genuine Rust proof code and the official verifier
        run: python tools/build_pearl_proof.py
      - name: Build and test native proof integration
        run: |
          cmake -S . -B build/proof-cmake -DCMAKE_BUILD_TYPE=Release -DNEURO_ENABLE_PROOF=ON
          cmake --build build/proof-cmake -j 2
          RAYON_NUM_THREADS=2 ctest --test-dir build/proof-cmake --output-on-failure
      - name: Verify proof corpus and controlled corruption with both implementations
        run: python tools/check_pearl_proofs.py
      - name: Exercise real loopback job lifecycle and independently verify submissions
        run: python tools/replay_pool.py --output artifacts/pool-replay.json
      - name: Retain proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-proof-evidence
          path: |
            artifacts/proof-build.json
            artifacts/proof-build/*.log
            artifacts/proof-check.json
            artifacts/pool-replay.json
            artifacts/pool-replay/
            build/proof-cmake/Testing/Temporary/LastTest.log
